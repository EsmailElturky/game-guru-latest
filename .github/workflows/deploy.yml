name: Deploy game-guru to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup NPM auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.UI_KIT_NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href="/GameGuru_Front_Admin_MVP1/"

      - name: Copy index to 404
        run: cp dist/Game-Gure/browser/index.html dist/Game-Gure/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/Game-Gure/browser/
