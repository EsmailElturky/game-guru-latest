<div class="px-5! py-5! flex flex-1 flex-col min-h-0">
  <form
    [formGroup]="organizationForm"
    class="flex min-h-0 flex-1 flex-col gap-10 overflow-y-auto"
    [class.pointer-events-none]="loading()"
    [class.opacity-60]="loading()"
  >
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-(--gray-50) rounded-xl p-6 border-2 border-dashed border-gray-200">
        <label class="font-bold text-sm text-gray-700 block mb-3">{{ 'signup.venueLogo' | translate }}</label>
        <uikit-file-input
          formControlName="logo"
          [multiple]="false"
          [validation]="fileValidation"
          [placeholder]="'profile.uploadPlaceholder' | translate"
        ></uikit-file-input>
      </div>
      <div class="bg-(--gray-50) rounded-xl p-6 border-2 border-dashed border-gray-200">
        <label class="font-bold text-sm text-gray-700 block mb-3">{{ 'signup.venueCover' | translate }}</label>
        <uikit-file-input
          formControlName="cover"
          [multiple]="false"
          [validation]="fileValidation"
          [placeholder]="'profile.uploadPlaceholder' | translate"
        ></uikit-file-input>
      </div>
    </div>

    <h3 class="text-lg font-bold text-gray-800 m-0!">{{ 'signup.venueInformation' | translate }}</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.nameEn' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false" formControlName="nameEn" [placeholder]="'profile.nameEn' | translate"></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.nameAr' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false" formControlName="nameAr" [placeholder]="'profile.nameAr' | translate"></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.email' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="email"
          [placeholder]="'profile.emailPlaceholder' | translate"
        ></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.phone' | translate }}</label>
        <uikit-mobile-input
          [options]="phoneCountryCodeOptions()"
          formControlName="phone"
        ></uikit-mobile-input>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.city' | translate }}</label>
        <uikit-select
          formControlName="cityId"
          [options]="cityOptions()"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'profile.selectItem' | translate"
        ></uikit-select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'signup.sportTypes' | translate }}</label>
        <uikit-multi-select
          formControlName="sports"
          [options]="sportOptions()"
          [placeholder]="'signup.sportTypes' | translate"
          optionLabel="label"
          optionValue="value"
        ></uikit-multi-select>
      </div>
      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{ 'signup.branchAddress' | translate }}</label>
        <uikit-map-input
          formControlName="mapLocation"
          [placeholder]="'signup.branchAddress' | translate"
          [label]="'signup.branchAddress' | translate"
          [useButtonLabel]="'signup.useMyLocation' | translate"
        ></uikit-map-input>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.descriptionEn' | translate }}</label>
        <uikit-text-area [emitOnBlur]="false"
          formControlName="description"
          [placeholder]="'profile.descriptionPlaceholder' | translate"
          [rows]="3"
        ></uikit-text-area>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.descriptionAr' | translate }}</label>
        <uikit-text-area [emitOnBlur]="false"
          formControlName="descriptionAr"
          [placeholder]="'profile.descriptionPlaceholder' | translate"
          [rows]="3"
        ></uikit-text-area>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700"> {{ 'profile.aboutEn' | translate }}</label>
        <uikit-text-area [emitOnBlur]="false" formControlName="about" [rows]="4"></uikit-text-area>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700"> {{ 'profile.aboutAr' | translate }}</label>
        <uikit-text-area [emitOnBlur]="false" formControlName="aboutAr" [rows]="4"></uikit-text-area>
      </div>

      @if (isEdit()) {
        <div class="flex flex-col gap-2 md:col-span-2">
          <label class="font-bold text-sm text-gray-700">{{ 'signup.venueGallery' | translate }}</label>
          <uikit-file-input
            formControlName="attachments"
            [multiple]="true"
            [validation]="fileValidation"
            [placeholder]="'profile.uploadPlaceholder' | translate"
          ></uikit-file-input>
        </div>
      }
    </div>

    @if (!isEdit()) {
    <h3 class="text-lg font-bold text-gray-800 m-0!">{{ 'signup.venueManagerInfo' | translate }}</h3>
    <div formGroupName="user" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{ 'signup.venueManagerPhoto' | translate }}</label>
        <uikit-file-input
          formControlName="imageProfile"
          [multiple]="false"
          [validation]="fileValidation"
          [placeholder]="'profile.uploadPlaceholder' | translate"
        ></uikit-file-input>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.fullName' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="fullName"
          [placeholder]="'profile.fullName' | translate"
        ></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.email' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="email"
          [placeholder]="'profile.emailPlaceholder' | translate"
        ></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.phone' | translate }}</label>
        <uikit-mobile-input
          [options]="phoneCountryCodeOptions()"
          formControlName="phone"
        ></uikit-mobile-input>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.birthDate' | translate }}</label>
        <uikit-date-picker formControlName="dateOfBirth" [maxDate]="maxDate"></uikit-date-picker>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.address' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="address"
          [placeholder]="'profile.addressPlaceholder' | translate"
        ></uikit-input-text>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'auth.setAPassword' | translate }}</label>
        <uikit-input-password
          formControlName="password"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        ></uikit-input-password>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'auth.confirmPassword' | translate }}</label>
        <uikit-input-password
          formControlName="confirmPassword"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        ></uikit-input-password>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'common.gender' | translate }}</label>
        <uikit-radio-button
          formControlName="gender"
          [options]="genderOptions()"
          [optionLabel]="'label'"
          [optionValue]="'value'"
          [layout]="'horizontal'"
        ></uikit-radio-button>
      </div>
    </div>

    <h3 class="text-lg font-bold text-gray-800 m-0!">{{ 'requests.membershipType' | translate }}</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'requests.membershipType' | translate }}</label>
        <uikit-select
          formControlName="membershipTypeId"
          [options]="membershipOptions()"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'profile.selectItem' | translate"
        ></uikit-select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'requests.fixedValue' | translate }}</label>
        <uikit-input-number formControlName="fixedValue"></uikit-input-number>
      </div>
      @if (requiresMembershipPercentage()) {
        <div class="flex flex-col gap-2">
          <label class="font-bold text-sm text-gray-700">{{ 'requests.percentage' | translate }}</label>
          <uikit-input-number formControlName="percentage"></uikit-input-number>
        </div>
      }
    </div>
    }
  </form>

  <div class="mt-4! flex shrink-0 justify-end gap-4 border-t border-gray-100 pt-4">
    <uikit-button
      type="button"
      [label]="'common.cancel' | translate"
      [style]="{
        width: '120px',
        height: '40px',
        borderRadius: '12px',
        fontSize: '16px',
        backgroundColor: '#f3f4f6',
        color: '#374151',
      }"
      (click)="cancel()"
    ></uikit-button>
    <uikit-button
      type="button"
      [label]="'common.save' | translate"
      [disabled]="organizationForm.invalid || saving() || loading()"
      [style]="{ width: '120px', height: '40px', borderRadius: '12px', fontSize: '16px' }"
      (click)="save()"
    ></uikit-button>
  </div>
</div>
