<div class="px-5! py-5! min-h-full flex flex-col flex-1">
  <div class="flex justify-end items-center mb-6">
    <uikit-button
      [icon]="'pi pi-download'"
      [style]="{
        backgroundColor: 'var(--surface-0)',
        color: 'var(--primary-color)',
        padding: '3px',
      }"
      (click)="exportCustomers()"
    ></uikit-button>
  </div>

  <div class="grid grid-cols-12 gap-4 mb-6! mt-6! items-end">
    <div class="col-span-12 sm:col-span-6 md:col-span-4">
      <uikit-input-text [emitOnBlur]="false"
        [placeholder]="'common.search' | translate"
        (input)="onSearchChange($event)"
      ></uikit-input-text>
    </div>
    <!-- <div class="col-span-12 sm:col-span-6 md:col-start-11 md:col-span-2 flex justify-end">
      <uikit-button
        [label]="'navigation.add-customer' | translate"
        [style]="{
          borderRadius: '12px',
          paddingLeft: '20px',
          paddingRight: '20px',
        }"
        (click)="addCustomer()"
      ></uikit-button>
    </div> -->
  </div>

  <div class="flex-1 min-h-0 overflow-hidden">
      <uikit-table
        class="h-full"
        [data]="customers()"
        [columns]="tableColumns()"
        [totalCount]="totalCount()"
        [rowsPerPage]="pageSize()"
        (selectionChanged)="onSelectionChange($event)"
        (pageChanged)="onPageChange({ page: $event })"
        (rowsPerPageChanged)="onRowsPerPageChanged($event)"
        (sortChanged)="onSortChange($event)"
        (rowClick)="viewCustomer($event.id)"
        [dropdownItems]="tableDropdownItems()"
        [paginator]="true"
      ></uikit-table>
  </div>
</div>
