<div class="px-5! py-5! flex flex-1 flex-col min-h-0">
  <form [formGroup]="introForm" class="flex min-h-0 flex-1 flex-col gap-10">
    <div>
      <div class="flex justify-center mb-8">
        <div
          class="w-full max-w-3xl bg-(--gray-50) rounded-xl p-8 border-2 border-dashed border-gray-200"
        >
          <uikit-file-input
            [multiple]="false"
            formControlName="ImageFile"
            [validation]="fileValidation"
            [placeholder]="'profile.uploadPlaceholder' | translate"
          ></uikit-file-input>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
        <div class="flex flex-col gap-2">
          <label class="font-bold text-sm text-gray-700">{{ 'table.titleEn' | translate }}</label>
          <uikit-input-text [emitOnBlur]="false"
            formControlName="Title"
            [placeholder]="'table.titleEn' | translate"
          ></uikit-input-text>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-sm text-gray-700">{{ 'table.titleAr' | translate }}</label>
          <uikit-input-text [emitOnBlur]="false"
            formControlName="TitleAr"
            [placeholder]="'table.titleAr' | translate"
          ></uikit-input-text>
        </div>
      </div>
    </div>
  </form>

  <div class="mt-4! flex shrink-0 justify-end gap-4 border-t border-gray-100 pt-4">
    <uikit-button
      [label]="'common.cancel' | translate"
      [style]="{
        width: '120px',
        height: '40px',
        borderRadius: '12px',
        fontSize: '16px',
        backgroundColor: '#f3f4f6',
        color: '#374151',
      }"
      (clicked)="cancel()"
    ></uikit-button>

    <uikit-button
      type="button"
      [label]="(introId() ? 'common.edit' : 'common.save') | translate"
      [style]="{ width: '120px', height: '40px', borderRadius: '12px', fontSize: '16px' }"
      (clicked)="save()"
    ></uikit-button>
  </div>
</div>
