<div class="px-5! py-5! min-h-full flex flex-col flex-1">
<div class="grid grid-cols-12 gap-4 mb-6! mt-6! items-end">
    <div class="col-span-12 sm:col-span-6 md:col-span-4">
      <uikit-input-text [emitOnBlur]="false"
        [placeholder]="'common.search' | translate"
        (input)="onSearchChange($event)"
      ></uikit-input-text>
    </div>
    @if (perms.canAdd()) {
      <div class="col-span-12 sm:col-span-6 md:col-start-11 md:col-span-2 flex justify-end">
        <uikit-button
          [label]="'navigation.add-faq' | translate"
          [style]="{
            borderRadius: '12px',
            paddingLeft: '20px',
            paddingRight: '20px',
          }"
          (click)="addFaq()"
        ></uikit-button>
      </div>
    }
  </div>

  <div class="flex-1 min-h-0 overflow-hidden">
    <uikit-table
      class="h-full"
      [data]="faqs()"
      [columns]="tableColumns()"
      [totalCount]="faqs().length"
      [rowsPerPage]="10"
      (selectionChanged)="onSelectionChange($event)"
      (pageChanged)="onPageChange($event)"
      (sortChanged)="onSortChange($event)"
      (rowClick)="viewFaq($event.id)"
      [dropdownItems]="tableDropdownItems()"
    ></uikit-table>
  </div>
</div>
