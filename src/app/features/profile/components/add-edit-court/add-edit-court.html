<div class="px-5! py-5! flex flex-1 flex-col min-h-0">
  <form [formGroup]="courtForm" class="flex min-h-0 flex-1 flex-col gap-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.nameEn' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="name"
          [placeholder]="'profile.nameEn' | translate"
        ></uikit-input-text>
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.nameAr' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="nameAr"
          [placeholder]="'profile.nameAr' | translate"
        ></uikit-input-text>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{
          'profile.descriptionEn' | translate
        }}</label>
        <uikit-text-area [emitOnBlur]="false"
          formControlName="description"
          [placeholder]="'profile.descriptionPlaceholder' | translate"
          [rows]="4"
        ></uikit-text-area>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{
          'profile.descriptionAr' | translate
        }}</label>
        <uikit-text-area [emitOnBlur]="false"
          formControlName="descriptionAr"
          [placeholder]="'profile.descriptionPlaceholder' | translate"
          [rows]="4"
        ></uikit-text-area>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.sport' | translate }}</label>
        <uikit-multi-select
          formControlName="Sports"
          [options]="sportOptions()"
          [placeholder]="'profile.selectItem' | translate"
          [optionLabel]="'label'"
          [optionValue]="'value'"
        ></uikit-multi-select>
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.width' | translate }}</label>
        <uikit-input-number formControlName="width"></uikit-input-number>
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.height' | translate }}</label>
        <uikit-input-number formControlName="height"></uikit-input-number>
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.courtPhotos' | translate }}</label>
        <div class="w-full bg-(--gray-50) rounded-xl p-6 border-2 border-dashed border-gray-200">
          <uikit-file-input
            formControlName="Attachments"
            [multiple]="true"
            [validation]="fileValidation"
            [placeholder]="'profile.uploadPlaceholder' | translate"
          ></uikit-file-input>
        </div>
      </div>
    </div>
  </form>

  <div class="mt-4! flex shrink-0 justify-end gap-4 border-t border-gray-100 pt-4">
    <uikit-button
      type="button"
      [label]="'common.cancel' | translate"
      [style]="{
        width: '140px',
        height: '44px',
        borderRadius: '12px',
        fontSize: '16px',
        backgroundColor: '#f3f4f6',
        color: '#374151',
      }"
      (click)="cancel()"
    ></uikit-button>
    <uikit-button
      type="button"
      [label]="'common.save' | translate"
      [loading]="saving()"
      [style]="{ width: '140px', height: '44px', borderRadius: '12px', fontSize: '16px' }"
      (click)="save()"
    ></uikit-button>
  </div>
</div>
