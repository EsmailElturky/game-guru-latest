<div class="flex flex-1 flex-col justify-between gap-10 min-h-full">
  <!-- Table Section -->
  <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
    <uikit-table
      class="h-full flex-1"
      [data]="notifications()"
      [columns]="tableColumns()"
      [totalCount]="totalCount()"
      [paginator]="true"
      [rowsPerPage]="pageSize()"
      (pageChanged)="onPageChanged($event)"
      (rowsPerPageChanged)="onRowsPerPageChanged($event)"
    ></uikit-table>
  </div>

  <!-- Action Button -->
  <div class="flex justify-end pt-4 border-t border-gray-100">
    <uikit-button
      [label]="'profile.addNotification' | translate"
      (click)="showAddNotificationDialog()"
      [style]="{
        width: 'fit-content',
        backgroundColor: 'var(--cyan-700)',
        borderRadius: '8px',
        padding: '10px 24px',
      }"
    ></uikit-button>
  </div>
</div>

<!-- Add Notification Dialog -->
<app-add-notification-dialog
  #addNotificationDialog
  (onSave)="onNotificationSave($event)"
></app-add-notification-dialog>
