<div class="flex flex-col flex-1 h-full gap-6">
  <div class="flex w-full items-center gap-4">
    <uikit-input-text [emitOnBlur]="false"
      [placeholder]="'common.search' | translate"
      (input)="onSearchChange($event)"
      [style]="{
        padding: '10px',
      }"
    ></uikit-input-text>
  </div>

  <div class="flex-1 min-h-0 overflow-hidden rounded-lg border border-gray-200">
    <uikit-table
      class="h-full"
      [paginator]="true"
      [data]="courts()"
      [columns]="tableColumns()"
      [totalCount]="totalCount()"
      [rowsPerPage]="pageSize()"
      [loading]="loading()"
      (pageChanged)="onPageChange($event)"
      (rowsPerPageChanged)="onRowsPerPageChanged($event)"
      (rowClick)="viewCourt($event.id)"
      [dropdownItems]="tableDropdownItems()"
      [rowsPerPageOptions]="[10, 20, 50]"
    ></uikit-table>
  </div>

  <div class="flex justify-end gap-3 mt-auto">
    <uikit-button
      [label]="'navigation.add-court' | translate"
      [style]="{
        backgroundColor: 'var(--surface-0)',
        color: 'var(--primary-color)',
        border: '1px solid var(--primary-color)',
        borderRadius: '6px',
        padding: '10px 20px',
      }"
      (click)="addCourt()"
    ></uikit-button>
  </div>
</div>
