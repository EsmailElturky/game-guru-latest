<div class="px-5 py-8 min-h-full flex flex-1 flex-col">
  <!-- Header Section -->
   @if (!authService.isAdminApp()!) {
  <div class="flex items-center justify-between p-8!">
    <div class="flex items-center gap-6">
      <div
        class="w-20 h-20 bg-white rounded-full flex items-center justify-center border border-gray-100 shadow-sm overflow-hidden"
      >
        <img
          [src]="
            authService.isAdminApp()!
              ? `${imageApi}/${authService.userData()!.imageName}`
              : `${imageApi}/${authService.userData()!.logoName}`
          "
          alt="Logo"
          class="w-12 h-12 object-contain"
        />
      </div>
      <div class="flex flex-col gap-1">
        <h2 class="text-2xl font-bold text-gray-900">{{ authService.userData()?.fullName }}</h2>
        <!-- <div
          class="flex items-center gap-2 px-3 py-1 bg-cyan-50 rounded-full w-fit border border-cyan-100"
        >
          <i class="pi pi-check text-[10px] text-cyan-600"></i>
          <span class="text-xs font-medium text-cyan-700">Client as of June 23, 2025</span>
        </div> -->
      </div>
    </div>
    <uikit-button
      [label]="'profile.editLogo' | translate"
      icon="pi pi-file-edit"
      (click)="openUploadLogoDialog()"
      [style]="{
        backgroundColor: 'transparent',
        color: 'var(--cyan-700)',
        border: '1px solid var(--cyan-200)',
        borderRadius: '8px',
        padding: '8px 16px',
      }"
    ></uikit-button>
  </div>
  }

  <div class="flex-1 flex flex-col">
    <p-tabs
      [value]="activeTab()"
      (valueChange)="onTabChange($event)"
      class="h-full flex-1 flex flex-col"
    >
      <p-tablist class="px-6 pt-2">
        @for (tab of tabs(); track tab.value) {
          <p-tab [value]="tab.value" class="text-base font-medium px-4 py-4">
            {{ tab.label | translate }}
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels class="flex-1 flex flex-col">
        <p-tabpanel [value]="'0'" class="p-8 flex-1 flex flex-col">
          <app-user-profile class="flex-1 flex flex-col"></app-user-profile>
        </p-tabpanel>
        <p-tabpanel [value]="'1'" class="p-8 flex-1 flex flex-col">
          <app-change-password class="flex-1 flex flex-col"></app-change-password>
        </p-tabpanel>
        <p-tabpanel [value]="'2'" class="p-8 flex-1 flex flex-col">
          <app-organization class="flex-1 flex flex-col"></app-organization>
        </p-tabpanel>
        <p-tabpanel [value]="'3'" class="p-8 flex-1 flex flex-col">
          <app-subscribtions class="flex-1 flex flex-col"></app-subscribtions>
        </p-tabpanel>
        <p-tabpanel [value]="'4'" class="p-8 flex-1 flex flex-col">
          <app-courts class="flex-1 flex flex-col"></app-courts>
        </p-tabpanel>
        <p-tabpanel [value]="'5'" class="p-8 flex-1 flex flex-col">
          <app-requests class="flex-1 flex flex-col"></app-requests>
        </p-tabpanel>
        <p-tabpanel [value]="'6'" class="p-8 flex-1 flex flex-col">
          <app-notification class="flex-1 flex flex-col"></app-notification>
        </p-tabpanel>
        <p-tabpanel [value]="'7'" class="p-8 flex-1 flex flex-col">
          <app-manager-notifications class="flex-1 flex flex-col"></app-manager-notifications>
        </p-tabpanel>
        <p-tabpanel [value]="'8'" class="p-8 flex-1 flex flex-col">
          <app-booking-slots class="flex-1 flex flex-col"></app-booking-slots>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>

<app-upload-logo-dialog (onUploadSuccess)="onLogoUploadSuccess()"></app-upload-logo-dialog>
