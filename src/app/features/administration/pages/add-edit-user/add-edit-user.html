<div class="px-5! py-5! flex flex-1 flex-col min-h-0 gap-10">
  <form [formGroup]="userForm" class="flex min-h-0 flex-1 flex-col gap-10">
    <!-- Image Upload Area -->
    <div class="flex justify-center">
      <div
        class="w-full max-w-3xl bg-(--gray-50) rounded-xl p-8 border-2 border-dashed border-gray-200"
      >
        <uikit-file-input
          [multiple]="false"
          [validation]="fileValidation"
          [placeholder]="'profile.uploadPlaceholder' | translate"
          formControlName="attachment"
        ></uikit-file-input>
      </div>
    </div>

    <!-- Form Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
      <!-- User Name -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.userName' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="username"
          [placeholder]="'profile.userNamePlaceholder' | translate"
        ></uikit-input-text>
      </div>

      <!-- Full Name -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.fullName' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="fullName"
          [placeholder]="'profile.fullNamePlaceholder' | translate"
        ></uikit-input-text>
      </div>

      <!-- Email Address -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'auth.email' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="email"
          [placeholder]="'profile.emailPlaceholder' | translate"
        ></uikit-input-text>
      </div>

      <!-- Mobile Number -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.phone' | translate }}</label>
        <uikit-mobile-input
          [options]="phoneCountryCodeOptions()"
          formControlName="phone"
        ></uikit-mobile-input>
      </div>

      <!-- Date of Birth -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.birthDate' | translate }}</label>
        <uikit-date-picker
          formControlName="dateOfBirth"
          [showIcon]="true"
          [maxDate]="maxDate"
        ></uikit-date-picker>
      </div>

      <!-- Address -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'profile.address' | translate }}</label>
        <uikit-input-text [emitOnBlur]="false"
          formControlName="address"
          [placeholder]="'profile.addressPlaceholder' | translate"
        ></uikit-input-text>
      </div>

      <!-- @if (!id()) { -->
      <!-- Password -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'auth.setAPassword' | translate }}</label>
        <uikit-input-password
          formControlName="password"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        ></uikit-input-password>
      </div>

      <!-- Confirm Password -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{
          'auth.confirmPassword' | translate
        }}</label>
        <uikit-input-password
          formControlName="confirmPassword"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        ></uikit-input-password>
      </div>
      <!-- } -->

      <!-- Gender -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'common.gender' | translate }}</label>
        <uikit-radio-button
          [options]="genderOptions()"
          formControlName="gender"
          [optionLabel]="'label'"
          [optionValue]="'value'"
          [layout]="'horizontal'"
        ></uikit-radio-button>
      </div>

      <!-- Role (Single-select) -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-700">{{ 'navigation.roles' | translate }}</label>
        <uikit-select
          [options]="rolesOptions()"
          optionLabel="label"
          optionValue="value"
          formControlName="groupRoleId"
          [placeholder]="'navigation.roles' | translate"
        ></uikit-select>
      </div>
    </div>
  </form>

  <div class="mt-4! flex shrink-0 justify-end gap-4 border-t border-gray-100 pt-4">
    <uikit-button
      type="button"
      (click)="cancel()"
      [label]="'common.cancel' | translate"
      [style]="{
        width: '140px',
        height: '44px',
        borderRadius: '12px',
        fontSize: '16px',
        backgroundColor: '#f3f4f6',
        color: '#374151',
      }"
    ></uikit-button>

    <uikit-button
      type="button"
      (click)="save()"
      [disabled]="userForm.invalid"
      [label]="'common.save' | translate"
      [style]="{ width: '140px', height: '44px', borderRadius: '12px', fontSize: '16px' }"
    ></uikit-button>
  </div>
</div>
